# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: ISDI_Linter

on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@985ef206aaca4d560cb9ee2af2b42ba44adc1d55  # v4.10.0
        env:
          # Only files changed in the push or pull request.
          VALIDATE_ALL_CODEBASE: false
          # Serious Python problems only (see .github/linters/.flake8) and
          # executable bits on shell scripts. Style linters (pylint, black,
          # isort, mypy, shellcheck) are off: the existing code has hundreds of
          # findings. New undefined names etc. are held by tests/test_lint_ratchet.py.
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_BASH_EXEC: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
