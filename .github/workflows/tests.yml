name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System packages (PDF printout tests)
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf poppler-utils
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sherloc/requirements.txt
          pip install pytest ruff==0.16.7
      - name: Run tests (includes the lint ratchet)
        run: python -m pytest -q
